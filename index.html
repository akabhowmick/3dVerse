<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Meta Tags -->
    <title>Print3Dverse</title>
    <meta
      name="description"
      content="Discover a wide selection of meticulously crafted 3D models of houses for architectural visualization and design projects. Explore our collection for detailed and realistic renderings, ranging from contemporary homes to traditional architecture styles. Find the perfect digital assets to bring your architectural visions to life."
    />

    <!-- Self-hosted fonts (see src/fonts.css): preload the three weights
         visible on first paint -- Barlow Condensed 800 (headings), 700 (nav,
         buttons, labels) and Barlow 400 (body). The rest load on demand. -->
    <link rel="preload" href="/fonts/barlow-condensed-800-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/barlow-condensed-700-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/barlow-400-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Favicon -->
    <link rel="icon" href="/favicon/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon-180x180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon/android-icon-192x192.png" />
    <link rel="manifest" href="/favicon/manifest.json" />
    <meta name="theme-color" content="#0e0f12" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
